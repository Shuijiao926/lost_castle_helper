name: lc2

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: lc2
      POSTGRES_USER: lc2_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 1g
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  pgdata:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
